# In die vorhandene iRedMail-Nginx-Konfiguration integrieren.
# Zertifikate werden weiterhin zentral auf dem Server verwaltet.
upstream tk0301_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

# Gehört in den http-Kontext und bremst automatisierte Anmeldeversuche.
limit_req_zone $binary_remote_addr zone=tk0301_login:10m rate=5r/m;

server {
    listen 443 ssl http2;
    server_name tk0301.site www.tk0301.site;

    location = /login {
        limit_req zone=tk0301_login burst=3 nodelay;
        proxy_pass http://tk0301_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://tk0301_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl http2;
    server_name wiki.tk0301.site;

    location = / { return 302 /wiki; }
    location / {
        proxy_pass http://tk0301_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
